<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kero 屏幕测试</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1f2328; --muted: #6b7280;
    --line: #e2e0da; --accent: #0e8fa8; --accent-text: #ffffff; --bad: #c0392b; --good: #1e8e5a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --panel: #1d2026; --text: #e8e6e1; --muted: #9aa0a8;
      --line: #2e323a; --accent: #4cc3d9; --accent-text: #06222a; --bad: #ff7b6b; --good: #5fd39a;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card + .card { margin-top: 16px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .screen {
    position: relative; width: 100%; max-width: 360px; aspect-ratio: 1; margin: 0 auto;
    border-radius: 50%; background: #000; overflow: hidden; border: 6px solid #22252b; touch-action: none; cursor: grab;
  }
  .screen.dragging { cursor: grabbing; }
  .screen.drop { border-color: var(--accent); }
  .screen canvas { width: 100%; height: 100%; display: block; }
  .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
          text-align: center; color: #9aa0a8; padding: 60px; pointer-events: none; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row + .row { margin-top: 10px; }
  button, .filebtn {
    font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input[type=file] { display: none; }
  input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
  label.inline { color: var(--muted); min-width: 3em; }
  .status { font-weight: 600; }
  .status.on { color: var(--good); }
  .status.off { color: var(--muted); }
  .status.err { color: var(--bad); }
  progress { width: 100%; height: 10px; accent-color: var(--accent); }
  #msg { min-height: 1.6em; color: var(--muted); margin-top: 6px; }
  #msg.err { color: var(--bad); }
  #log {
    margin: 0; height: 190px; overflow: auto; white-space: pre-wrap; word-break: break-all;
    font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--muted);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px;
  }
  .cmd { display: flex; gap: 8px; margin-top: 8px; }
  .cmd input { flex: 1; font: 13px ui-monospace, Menlo, Consolas, monospace; padding: 7px 10px;
               border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  .warn { border-color: var(--bad); color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Kero 屏幕测试</h1>
  <p class="sub">把图片发到机器人的圆屏上。默认画面是会眨眼的表情，随时可以恢复。</p>

  <div id="unsupported" class="card warn" hidden>
    这个浏览器不支持网页串口。请用电脑上的 Chrome 或 Edge 打开本页面。
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <h2>图片预览（360 × 360，圆形以外的部分屏幕上看不到）</h2>
        <div class="screen" id="screen">
          <canvas id="cv" width="360" height="360"></canvas>
          <div class="hint" id="hint">点"选择图片"，或把图片拖到这里</div>
        </div>
        <div class="row" style="margin-top:14px">
          <label class="filebtn" for="file">选择图片</label>
          <input type="file" id="file" accept="image/*">
          <label class="inline" for="zoom">缩放</label>
          <input type="range" id="zoom" min="1" max="4" step="0.01" value="1" disabled>
        </div>
        <div class="row">
          <button class="primary" id="send" disabled>发送到屏幕</button>
          <span class="sub" style="margin:0">拖动图片可以调整位置</span>
        </div>
        <div class="row"><progress id="prog" value="0" max="1" hidden></progress></div>
        <div id="msg"></div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>连接</h2>
        <div class="row">
          <button class="primary" id="connect">连接机器人</button>
          <span class="status off" id="status">未连接</span>
        </div>
        <p class="sub" style="margin:10px 0 0">用 USB 接电源板的 Type-C。同一时间只能有一个程序占用串口，先关掉其它串口终端。</p>
      </div>

      <div class="card">
        <h2>屏幕</h2>
        <div class="row">
          <button data-cmd="face" class="needs-port" disabled>恢复表情</button>
          <button data-cmd="img show" class="needs-port" disabled>再显示上一张图</button>
          <button data-cmd="lcd test" class="needs-port" disabled>彩条测试</button>
          <button data-cmd="init display" class="needs-port" disabled>重新初始化屏幕</button>
        </div>
        <div class="row">
          <label class="inline" for="bl">亮度</label>
          <input type="range" id="bl" min="0" max="100" step="5" value="60" class="needs-port" disabled>
          <span id="blv">60%</span>
        </div>
      </div>

      <div class="card">
        <h2>串口输出</h2>
        <pre id="log"></pre>
        <form class="cmd" id="cmdform">
          <input id="cmd" placeholder="输入命令，例如 status" autocomplete="off" class="needs-port" disabled>
          <button class="needs-port" disabled>发送</button>
        </form>
      </div>
    </div>
  </div>
</main>

<script>
'use strict';
const SIZE = 360;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d', { willReadFrequently: true });

/* ---------------- picture: choose, zoom, drag ---------------- */
let picture = null, zoom = 1, offX = 0, offY = 0;

function drawPicture() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, SIZE, SIZE);
  if (!picture) return;
  const s = Math.max(SIZE / picture.width, SIZE / picture.height) * zoom;   // cover the screen
  const w = picture.width * s, h = picture.height * s;
  const maxX = (w - SIZE) / 2, maxY = (h - SIZE) / 2;
  offX = Math.min(maxX, Math.max(-maxX, offX));
  offY = Math.min(maxY, Math.max(-maxY, offY));
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(picture, (SIZE - w) / 2 + offX, (SIZE - h) / 2 + offY, w, h);
}

async function loadPicture(file) {
  if (!file || !file.type.startsWith('image/')) return;
  try {
    picture = await createImageBitmap(file);
  } catch (e) {
    say('这个文件打不开：' + e.message, true);
    return;
  }
  zoom = 1; offX = offY = 0;
  $('zoom').value = 1; $('zoom').disabled = false;
  $('hint').hidden = true;
  drawPicture();
  updateButtons();
  say('');
}

$('file').addEventListener('change', e => loadPicture(e.target.files[0]));
$('zoom').addEventListener('input', e => { zoom = +e.target.value; drawPicture(); });

const screenEl = $('screen');
screenEl.addEventListener('dragover', e => { e.preventDefault(); screenEl.classList.add('drop'); });
screenEl.addEventListener('dragleave', () => screenEl.classList.remove('drop'));
screenEl.addEventListener('drop', e => {
  e.preventDefault(); screenEl.classList.remove('drop');
  loadPicture(e.dataTransfer.files[0]);
});
let drag = null;
screenEl.addEventListener('pointerdown', e => {
  if (!picture) return;
  drag = { x: e.clientX, y: e.clientY, offX, offY };
  screenEl.setPointerCapture(e.pointerId); screenEl.classList.add('dragging');
});
screenEl.addEventListener('pointermove', e => {
  if (!drag) return;
  const k = SIZE / screenEl.clientWidth;
  offX = drag.offX + (e.clientX - drag.x) * k;
  offY = drag.offY + (e.clientY - drag.y) * k;
  drawPicture();
});
screenEl.addEventListener('pointerup', () => { drag = null; screenEl.classList.remove('dragging'); });

/* The picture as the board wants it: RGB565, high byte first, as base64 text. */
function pictureBase64() {
  const rgba = ctx.getImageData(0, 0, SIZE, SIZE).data;
  let bin = '';
  for (let row = 0; row < SIZE; row++) {
    const line = new Uint8Array(SIZE * 2);
    for (let x = 0; x < SIZE; x++) {
      const i = (row * SIZE + x) * 4;
      const v = ((rgba[i] & 0xF8) << 8) | ((rgba[i + 1] & 0xFC) << 3) | (rgba[i + 2] >> 3);
      line[2 * x] = v >> 8; line[2 * x + 1] = v & 0xFF;
    }
    bin += String.fromCharCode.apply(null, line);
  }
  return btoa(bin);
}

/* ---------------- serial port ---------------- */
let port = null, writer = null, busy = false;
let rx = '';            // text received since it was last cleared
let dots = -1;          // >= 0 while a picture is being sent: blocks acknowledged so far
const waiters = new Set();
const enc = new TextEncoder();

function log(text) {
  const el = $('log');
  el.textContent = (el.textContent + text).slice(-6000);
  el.scrollTop = el.scrollHeight;
}

function onData(text) {
  rx += text;
  if (dots >= 0) {
    dots += (text.match(/\./g) || []).length;
    text = text.replace(/\./g, '');     // keep the progress dots out of the log
  }
  if (text) log(text);
  for (const w of [...waiters]) w();
}

/* Resolves when test() is true; rejects after ms without it. */
function waitFor(test, ms, what) {
  return new Promise((resolve, reject) => {
    const check = () => { if (test()) { done(); resolve(); } };
    const timer = setTimeout(() => { done(); reject(new Error(what + '：等待超时')); }, ms);
    const done = () => { clearTimeout(timer); waiters.delete(check); };
    waiters.add(check);
    check();
  });
}

async function readLoop() {
  const dec = new TextDecoder();
  const reader = port.readable.getReader();
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      onData(dec.decode(value, { stream: true }));
    }
  } catch (e) {
    log('\n[串口断开：' + e.message + ']\n');
  } finally {
    reader.releaseLock();
    disconnected();
  }
}

function disconnected() {
  port = null; writer = null;
  $('status').textContent = '未连接'; $('status').className = 'status off';
  $('connect').textContent = '连接机器人';
  updateButtons();
}

async function connect() {
  try {
    const p = await navigator.serial.requestPort();
    await p.open({ baudRate: 115200 });
    port = p;
    writer = port.writable.getWriter();
    readLoop();
    $('status').textContent = '已连接'; $('status').className = 'status on';
    $('connect').textContent = '断开';
    updateButtons();
    await writeText('\n');
  } catch (e) {
    if (e.name !== 'NotFoundError') {   // NotFoundError: the user closed the chooser
      $('status').textContent = '连接失败：' + e.message; $('status').className = 'status err';
    }
  }
}

async function disconnect() {
  try { writer.releaseLock(); await port.readable.cancel(); await port.close(); } catch (e) { /* already gone */ }
  disconnected();
}

function writeText(text) {
  return writer.write(enc.encode(text));
}

/* Wait until the board shows its prompt and is ready for a command. */
async function waitPrompt() {
  rx = '';
  await writeText('\n');
  await waitFor(() => /kero>\s*$/.test(rx), 8000, '机器人没有回应');
}

async function runCommand(cmd) {
  if (!port || busy) return;
  busy = true; updateButtons();
  try {
    await waitPrompt();
    rx = '';
    await writeText(cmd + '\n');
    await waitFor(() => /kero>\s*$/.test(rx), 8000, cmd);
    say('');
  } catch (e) {
    say(e.message, true);
  } finally {
    busy = false; updateButtons();
  }
}

async function sendPicture() {
  if (!port || !picture || busy) return;
  busy = true; updateButtons();
  const prog = $('prog');
  try {
    const data = pictureBase64();
    say('正在连接…');
    await waitPrompt();
    rx = '';
    await writeText('img recv\n');
    await waitFor(() => /READY \d+\s/.test(rx) || /ERR/.test(rx), 5000, '开始传输');
    const ready = rx.match(/READY (\d+)/);
    if (!ready) throw new Error('机器人拒绝接收：' + (rx.match(/ERR[^\n]*/) || [''])[0]);
    const chunk = +ready[1];

    rx = ''; dots = 0;
    prog.hidden = false; prog.max = data.length; prog.value = 0;
    const t0 = performance.now();
    for (let pos = 0, n = 0; pos < data.length; pos += chunk, n++) {
      await writeText(data.slice(pos, pos + chunk));
      await waitFor(() => dots > n || /ERR/.test(rx), 5000, '传输中断');
      if (/ERR/.test(rx)) throw new Error('机器人报错：' + (rx.match(/ERR[^\n]*/) || [''])[0]);
      if (n % 20 === 0) {
        prog.value = pos;
        say('正在发送… ' + Math.round(pos * 100 / data.length) + '%');
      }
    }
    await waitFor(() => /DONE/.test(rx) || /ERR/.test(rx), 5000, '结束传输');
    if (!/DONE/.test(rx)) throw new Error('机器人报错：' + (rx.match(/ERR[^\n]*/) || [''])[0]);
    prog.value = data.length;
    say('发送完成，用时 ' + ((performance.now() - t0) / 1000).toFixed(1) + ' 秒。图片保存在内存里，重启后恢复为表情。');
  } catch (e) {
    say(e.message, true);
  } finally {
    dots = -1; busy = false; updateButtons();
  }
}

/* ---------------- page ---------------- */
function say(text, isError) {
  $('msg').textContent = text;
  $('msg').className = isError ? 'err' : '';
}

function updateButtons() {
  for (const el of document.querySelectorAll('.needs-port')) el.disabled = !port || busy;
  $('send').disabled = !port || !picture || busy;
}

$('connect').addEventListener('click', () => port ? disconnect() : connect());
$('send').addEventListener('click', sendPicture);
for (const b of document.querySelectorAll('button[data-cmd]')) {
  b.addEventListener('click', () => runCommand(b.dataset.cmd));
}
$('bl').addEventListener('input', e => { $('blv').textContent = e.target.value + '%'; });
$('bl').addEventListener('change', e => runCommand('lcd bl ' + e.target.value));
$('cmdform').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('cmd').value.trim();
  if (v) { runCommand(v); $('cmd').value = ''; }
});

if (!('serial' in navigator)) {
  $('unsupported').hidden = false;
  $('connect').disabled = true;
}
drawPicture();
</script>
</body>
</html>
