; Kero desktop robot - main board firmware (ESP32-S3-WROOM-1-N16R8)
; Builds with PlatformIO (pio run) or with plain ESP-IDF (idf.py build).
[platformio]
src_dir = main
default_envs = kero

[env:kero]
platform = espressif32@8.0.0   ; ESP-IDF 6.1
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
